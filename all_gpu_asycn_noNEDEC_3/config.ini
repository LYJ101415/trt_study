# all_gpu_asycn_noNEDEC_3 示例配置（优先级：命令行 > 本文件 > 代码默认值）
# 键名大小写不敏感；支持 `key = value` 或 `key : value`，# 开头为注释。

[model]
engine_path = /root/my_FILE/models/yolov8_int8_static_e2e.engine

[data]
images_dir = /root/autodl-tmp/Data_DeepPCB_YOLO/images/test_scaled
output_dir = ./images_results

[infer]
conf = 0.25
iou  = 0.65

[pipeline]
num_buffers        = 12    # 需容纳 解码×N + 3级GPU + 保存×N
num_streams        = 3     # 1=单流串行  3=预处理/推理/后处理 三流异步流水
num_decode_threads = 3     # CPU 解码线程数
num_save_threads   = 3     # CPU 保存线程数（jpeg 编码 + 写盘）
draw_thickness     = 2
print_dets         = false
